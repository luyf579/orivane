[project]
name = "orivane-cli"
version = "0.1.0.dev0"
description = "Local developer CLI for Orivane"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "cli", "opentelemetry"]
dependencies = [
    "orivane-core==0.1.0.dev0",
    "orivane-backend-pydantic==0.1.0.dev0",
    "opentelemetry-sdk>=1.44,<2",
]
classifiers = ["Private :: Do Not Upload", "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12"]

[project.urls]
Repository = "https://github.com/luyf579/orivane"
Documentation = "https://github.com/luyf579/orivane/tree/main/docs"
Issues = "https://github.com/luyf579/orivane/issues"

[project.scripts]
orivane = "orivane_cli._main:main"

[tool.uv.sources]
orivane-core = { workspace = true }
orivane-backend-pydantic = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orivane_cli"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]
