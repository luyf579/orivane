[project]
name = "orivane-backend-pydantic"
version = "0.1.1"
description = "Development PydanticAI runtime with validated tools and native session state"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "pydantic-ai", "typing"]
dependencies = ["orivane-core==0.1.1", "pydantic-ai-slim==2.54.0"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/luyf579/orivane"
Documentation = "https://github.com/luyf579/orivane/tree/main/docs"
Issues = "https://github.com/luyf579/orivane/issues"

[tool.uv.sources]
orivane-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orivane_pydantic"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/LICENSE"]
