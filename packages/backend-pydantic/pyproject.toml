[project]
name = "agent-framework-backend-pydantic"
version = "0.1.0.dev0"
description = "Provisional PydanticAI adapter boundary; execution not yet implemented"
requires-python = ">=3.11"
dependencies = ["agent-framework-core==0.1.0.dev0", "pydantic-ai-slim==2.48.0"]
classifiers = ["Private :: Do Not Upload"]

[tool.uv.sources]
agent-framework-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_pydantic"]
