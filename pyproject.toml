[project]
name = "agent-framework-workspace"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.12.18"

[tool.uv.workspace]
members = ["packages/core", "packages/backend-pydantic", "packages/cli"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "coverage[toml]>=7,<8",
    "opentelemetry-sdk>=1.44,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/core/src", "packages/backend-pydantic/src", "packages/cli/src", "packages/core/tests", "packages/backend-pydantic/tests", "packages/cli/tests", "tests"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/backend-pydantic/tests", "packages/cli/tests", "tests/contract"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib -ra"

[tool.coverage.run]
branch = true
source = ["agent_framework_core", "agent_framework_pydantic", "agent_framework_cli"]

[tool.coverage.report]
show_missing = true
fail_under = 100
