[project]
name = "orivane-core"
version = "0.1.1"
description = "Typed Orivane agent contracts, sessions and linear workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "typing", "workflow", "sessions"]
dependencies = ["pydantic>=2.12,<3", "opentelemetry-api>=1.44,<2"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Typing :: Typed"]

[project.urls]
Repository = "https://github.com/luyf579/orivane"
Documentation = "https://github.com/luyf579/orivane/tree/main/docs"
Issues = "https://github.com/luyf579/orivane/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orivane_core"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/LICENSE"]
