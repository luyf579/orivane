name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report

  packaging:
    name: Packaging Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
      - run: uv run --no-project python scripts/packaging_check.py --output artifacts/packaging

  otel-compatibility:
    name: Trace Python ${{ matrix.python-version }} OTel ${{ matrix.otel-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        otel-version: ["1.44.0", "1.45.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages
      - name: Install selected OTel API and SDK without rewriting the lock
        run: >-
          uv pip install --python .venv/bin/python
          "opentelemetry-api==${{ matrix.otel-version }}"
          "opentelemetry-sdk==${{ matrix.otel-version }}"
      - name: Formatter, real bytes trace, privacy and failure regressions
        run: >-
          uv run --no-sync python -m pytest
          packages/cli/tests/test_cli_trace_attributes.py
          packages/cli/tests/test_cli_trace.py
          packages/cli/tests/test_cli_integration.py::test_cli_trace_bytes_attributes_subprocess
          packages/cli/tests/test_cli_integration.py::test_cli_subprocess_error_message_privacy
