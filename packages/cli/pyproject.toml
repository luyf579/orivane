[project]
name = "agent-framework-cli"
version = "0.1.0.dev0"
description = "Provisional local developer CLI for Agent Framework"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==0.1.0.dev0",
    "agent-framework-backend-pydantic==0.1.0.dev0",
    "opentelemetry-sdk>=1.44,<2",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
agent-framework = "agent_framework_cli._main:main"

[tool.uv.sources]
agent-framework-core = { workspace = true }
agent-framework-backend-pydantic = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_cli"]
