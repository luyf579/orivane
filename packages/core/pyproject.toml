[project]
name = "agent-framework-core"
version = "0.1.0.dev0"
description = "Provisional internal Agent backend contract"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "opentelemetry-api>=1.44,<2"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_core"]
